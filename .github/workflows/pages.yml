name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build static frontend
        run: npm run build:pages
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://averixlabs.in' }}
          NEXT_PUBLIC_INQUIRY_API_URL: ${{ vars.NEXT_PUBLIC_INQUIRY_API_URL }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      - name: Set custom domain
        run: node -e "require('fs').writeFileSync('out/CNAME', new URL(process.env.NEXT_PUBLIC_SITE_URL).hostname + '\n')"
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://averixlabs.in' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy frontend
        id: deployment
        uses: actions/deploy-pages@v4
